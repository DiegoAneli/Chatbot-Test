<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="web_dashboard" name="shell-type" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "background": "#fff9ed", "on-tertiary-fixed-variant": "#134e51", "surface-variant": "#e9e2d2", "on-tertiary-container": "#95cbcd", "on-error": "#ffffff", "on-primary-fixed": "#191b26", "tertiary-container": "#1f5759", "inverse-on-surface": "#f7f0e0", "surface-bright": "#fff9ed", "on-surface-variant": "#46464c", "error": "#ba1a1a", "secondary-container": "#fda77a", "surface-tint": "#5d5d6b", "surface-container-low": "#faf3e3", "tertiary-fixed-dim": "#9ad0d2", "tertiary": "#003f41", "surface-container": "#f4eddd", "outline-variant": "#c7c5cc", "inverse-primary": "#c5c5d5", "on-secondary-fixed-variant": "#723612", "secondary-fixed": "#ffdbcb", "surface-dim": "#e0d9ca", "on-error-container": "#93000a", "secondary-fixed-dim": "#ffb691", "primary": "#363744", "surface": "#fff9ed", "inverse-surface": "#333026", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "surface-container-highest": "#e9e2d2", "on-tertiary-fixed": "#002021", "on-background": "#1e1c12", "outline": "#77767c", "on-primary": "#ffffff", "on-surface": "#1e1c12", "tertiary-fixed": "#b5ecee", "primary-fixed-dim": "#c5c5d5", "on-secondary": "#ffffff", "on-secondary-container": "#773a16", "secondary": "#8f4d27", "on-primary-fixed-variant": "#454653", "surface-container-high": "#efe8d8", "on-tertiary": "#ffffff", "primary-fixed": "#e2e1f1", "on-primary-container": "#c0c0cf", "on-secondary-fixed": "#341100", "primary-container": "#4d4e5b" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2.25rem", "space-xs": "0.25rem", "gutter-mobile": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem", "gutter": "1.25rem", "space-sm": "0.5rem", "margin": "2rem", "margin-mobile": "1rem" }, "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "title-lg": ["Plus Jakarta Sans"] }, "fontSize": { "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };
  </script>
</head>

<body class="bg-slate-950 font-body-md text-on-surface min-h-screen">
  <div class="w-full min-h-screen flex flex-col items-center justify-center">
    <main
      class="w-full min-h-screen bg-slate-950-container-low flex flex-col items-center justify-center p-3 sm:p-6 md:p-8">
      <div class="flex flex-col w-full items-center justify-center">
        <div
          class="chat-main-container w-full max-w-full sm:max-w-xl md:max-w-2xl lg:max-w-4xl mx-auto flex flex-col shadow-2xl rounded-2xl overflow-hidden bg-surface-container-high border border-outline-variant/20">
          <div class="w-full h-full flex flex-col flex-1 overflow-hidden relative">
            <div
              class="bg-primary-container px-4 py-3 sm:px-space-lg sm:py-space-md flex items-center justify-between text-on-primary flex-shrink-0">
              <div class="flex items-center gap-3 sm:gap-space-md">
                <div
                  class="relative w-10 h-10 sm:w-11 sm:h-11 border-solid border-white rounded-r-full bg-surface-container flex items-center justify-center p-1.5 shadow-sm">
                  <img alt="SurfBot Logo" class="w-full h-full object-contain rounded-full" src="./image/surfer.png" />
                  <span
                    class="absolute bottom-0 right-0 w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full bg-[#10b981] ring-2 ring-primary-container"></span>
                </div>
                <div class="flex flex-col">
                  <div class="flex items-center gap-2">
                    <h2 class="font-title-lg text-title-md sm:text-title-lg text-on-primary tracking-tight">SurfBot</h2>
                    <span
                      class="px-2 py-0.5 rounded-full bg-tertiary-container text-on-tertiary-container font-label-sm text-label-sm">AI
                      Assist</span>
                  </div>
                  <div class="flex items-center gap-1.5 font-label-sm text-label-sm text-on-primary-container">
                    <span class="w-2 h-2 rounded-full bg-[#10b981]"></span>
                    <span>online</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-space-xs">
                <span
                  class="hidden sm:inline-block px-3 py-1 rounded-full bg-surface-container-high/20 text-on-primary text-label-sm font-label-sm">Surf
                  Beach Hub</span>
              </div>
            </div>
            <!-- Chat Messages Viewport (Generato dinamicamente dall'array chatMessages in main.js) -->
            <div
              class="p-3 sm:p-space-lg md:p-space-xl flex flex-col gap-3 sm:gap-space-lg flex-1 min-h-[300px] overflow-y-auto bg-surface-container-high/90"
              id="chat-messages-container">
            </div>

            <div class="p-3 sm:p-space-md md:p-space-lg bg-surface-container-high flex-shrink-0">
              <form class="relative flex items-center w-full" id="chat-input-form" onsubmit="handleChatSubmit(event)">
                <div
                  class="w-full flex items-center bg-primary-container rounded-full shadow-lg pl-3 sm:pl-space-md pr-1.5 py-1.5 transition-all focus-within:ring-2 focus-within:ring-tertiary">

                  <input autocomplete="off"
                    class="w-full bg-transparent border-0 outline-none text-on-primary placeholder:text-on-primary-container/70 font-body-md text-sm sm:text-body-md px-2 sm:px-space-sm"
                    id="user-input-field" placeholder="Scrivi un messaggio a SurfBot..." type="text" />
                  <div class="flex items-center gap-1 sm:gap-1.5 flex-shrink-0">
                    <button
                      class="hidden sm:flex items-center justify-center p-2 rounded-full text-on-primary-container hover:text-on-primary transition-colors"
                      title="Nota vocale" type="button">
                      <span class="material-symbols-outlined text-[18px] sm:text-[20px]">mic</span>
                    </button>

                    <button
                      class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-secondary hover:brightness-110 active:scale-95 text-on-secondary flex items-center justify-center shadow-md transition-all flex-shrink-0"
                      title="Invia messaggio" type="submit">
                      <span class="material-symbols-outlined text-[18px] sm:text-[20px] -rotate-45 ml-0.5">send</span>
                    </button>
                  </div>
                </div>
              </form>
              <div
                class="flex items-center justify-between px-2 sm:px-space-md pt-2 text-on-surface-variant font-label-sm text-xs sm:text-label-sm">
                <span class="truncate">Surf Beach Hub • Sydney</span>
                <span class="hidden md:inline">Surf Life Saving Club Area • Ritiro h06:00 - 19:00</span>
              </div>
            </div>
          </div>
        </div>
        <script src="main.js"></script>
      </div>
    </main>
  </div>
</body>

</html>
